name: Windows 版测试

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: 单元测试（含 SendInput 注入、HID 枚举、开机自启读写）
        run: go test -v ./...
      - name: 编译
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o JoyClicker.exe .
      - name: 启动冒烟测试（托盘、单实例、HID 枚举跑一轮后正常退出）
        shell: pwsh
        run: |
          $p = Start-Process .\JoyClicker.exe -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "30 秒没退出" }
          if ($p.ExitCode -ne 0) { throw "退出码 $($p.ExitCode)" }
          "冒烟测试通过，退出码 0"
      - uses: actions/upload-artifact@v4
        with:
          name: JoyClicker-Windows-x64
          path: windows/JoyClicker.exe
